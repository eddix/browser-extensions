<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      padding: 40px;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #a8e6cf;
    }
    .subtitle {
      color: #888;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #ddd;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #0f3460;
      border-radius: 8px;
      font-size: 14px;
      background: #16213e;
      color: #eee;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .save-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .save-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .test-btn {
      background: #16213e;
      color: #a8e6cf;
      border: 1px solid #0f3460;
      margin-left: 12px;
    }
    .test-btn:hover {
      background: #0f3460;
    }
    .status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success {
      background: rgba(168, 230, 207, 0.2);
      color: #a8e6cf;
      display: block;
    }
    .status.error {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Vesper Settings</h1>
    <p class="subtitle">Configure the connection to your local Vesper backend</p>

    <div class="form-group">
      <label for="apiUrl">Backend API URL</label>
      <input type="text" id="apiUrl" placeholder="http://localhost:8787/api/links">
      <p class="hint">The URL of your Vesper Rust backend</p>
    </div>

    <div>
      <button id="save" class="save-btn">Save Settings</button>
      <button id="test" class="test-btn">Test Connection</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
