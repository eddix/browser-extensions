<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 16px;
      text-align: center;
      color: #a8e6cf;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .primary-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .secondary-btn {
      background: #16213e;
      color: #a8e6cf;
      border: 1px solid #0f3460;
    }
    .secondary-btn:hover {
      background: #0f3460;
    }
    .divider {
      height: 1px;
      background: #0f3460;
      margin: 12px 0;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
    }
    .footer a {
      color: #667eea;
      font-size: 12px;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    #status.success {
      background: rgba(168, 230, 207, 0.2);
      color: #a8e6cf;
      display: block;
    }
    #status.error {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      display: block;
    }
  </style>
</head>
<body>
  <h1>📚 Vesper</h1>

  <div class="button-group">
    <button id="sendCurrent" class="primary-btn">
      Send Current Tab
    </button>
    <button id="sendWindow" class="secondary-btn">
      Send All Tabs in Window
    </button>
  </div>

  <div class="divider"></div>

  <div class="footer">
    <a href="#" id="openOptions">⚙️ Settings</a>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
