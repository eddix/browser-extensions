<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- hedra — per-domain header rules, set and left alone.
       Two faders, drawn here rather than taken from a set. Phosphor's own
       `faders` is three tracks and three handles, which at 16px is six strokes
       about a pixel wide each and renders as noise — unreadable at the one
       size the toolbar actually uses. Two tracks and two offset handles
       survive the pixel grid and still say "sliders".

       Single colour, no duotone second layer, unlike nodia. On a transparent
       background `opacity` is not a lighter shade, it is a blend with whatever
       is behind: the same 0.38 track vanished into a white toolbar and again
       into a dark one. Track and handle are told apart by weight instead,
       which costs nothing at any size.

       Tracks run the full height. The 4 units of slack left and right are the
       handles' overhang, not padding, and the glyph is centred on it.

       Colour is checked by tools/icon-contrast.py against both toolbars. -->
  <g transform="scale(0.5)"><g fill="#78808F"><rect x="47" y="0" width="34" height="256" rx="17"/><rect x="175" y="0" width="34" height="256" rx="17"/><rect x="8" y="52" width="112" height="60" rx="30"/><rect x="136" y="148" width="112" height="60" rx="30"/></g></g>
</svg>
