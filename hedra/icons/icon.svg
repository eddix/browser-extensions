<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- hedra — per-domain header rules, set and left alone.
       Glyph: Phosphor Icons, duotone weight (MIT). https://phosphoricons.com
       The 256-unit glyph is nested and scaled so its own coordinates stay
       untouched: swapping in another Phosphor icon means pasting its two paths
       and nothing else. The duotone layer is lifted from Phosphor's 0.2 to 0.32
       because it is white on a saturated ground here rather than dark on white,
       and at 16px the lighter value disappeared into the background.

       Drawn at 88 of 128 where nodia's archive sits at 72. Same number would
       not mean same size: faders is six thin strokes and archive is two thick
       ones, so at matching geometry the sliders lost to the background first —
       at 16px, which is the size it is actually used at. -->
  <rect width="128" height="128" rx="28" fill="#3B4252"/>
