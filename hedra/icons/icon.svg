<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- hedra — per-domain header rules, set and left alone.
       Faders, in the spirit of Phosphor's duotone set (https://phosphoricons.com)
       but redrawn rather than pasted. Phosphor's own `faders` is three tracks
       and three handles, and at 16px that is six strokes about a pixel wide
       each: it rendered as noise, unreadable at the one size the toolbar
       actually uses. Two tracks and two offset handles survive the pixel grid
       and still say "sliders". The duotone split is kept — tracks at 0.32,
       handles solid — so the pair still reads as one family with nodia.

       Coordinates are in Phosphor's 256-unit space and scaled by 0.390625 for
       the 100-of-128 box, so the glyph can be swapped for a real Phosphor path
       without touching anything around it. -->
  <rect width="128" height="128" rx="20" fill="#3B4252"/>
  <g fill="#FFFFFF" transform="translate(14 14) scale(0.390625)"><g opacity="0.32"><rect x="78" y="28" width="18" height="200" rx="9"/><rect x="160" y="28" width="18" height="200" rx="9"/></g><rect x="40" y="72" width="94" height="34" rx="17"/><rect x="122" y="150" width="94" height="34" rx="17"/></g>
</svg>
