<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- nodia — the page is not in the vault yet.
       Glyph: Phosphor Icons, duotone weight (MIT). https://phosphoricons.com
       Its own 256-unit coordinates are left untouched inside the transform, so
       another Phosphor icon can be swapped in by pasting its two paths.

       No background tile. The toolbar's own icons are strokes on nothing, and
       a filled rounded square sitting next to them reads as the loud one in
       the row. Which also frees up the duotone layer: state used to be the
       tile's colour, and now it is the colour of what is *in* the box —
       blue for a box you have not filed anything into.

       "Fill the square" only goes as far as the drawing's own shape allows.
       The archive is 224 by 160 units, so scaling it until the sides touch
       leaves 9 units above and below; stretching it to reach them would just
       be a squashed box.

       Colours are pinned between a near-white toolbar and a near-black one and
       cannot be improved by picking darker or lighter — see
       tools/icon-contrast.py, which measures both and knows the ceiling. -->
  <g transform="translate(-9.1429 -9.1429) scale(0.571429)"><path d="M216,96v96a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V96Z" fill="#6E7CBC"/><path d="M224,48H32A16,16,0,0,0,16,64V88a16,16,0,0,0,16,16v88a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V104a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48ZM208,192H48V104H208ZM224,88H32V64H224V88ZM96,136a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,136Z" fill="#78808F"/></g>
