<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- nodia, saved state — this page is already in the vault.
       Glyph: Phosphor Icons, duotone weight (MIT). https://phosphoricons.com
       The 256-unit glyph is nested at 0.390625 so its own coordinates stay
       untouched: swapping in another Phosphor icon means pasting its two paths
       and nothing else. The duotone layer is lifted from Phosphor's 0.2 to
       0.32 because it is white on a saturated ground here rather than dark on
       white, and at 16px the lighter value disappeared into the background.

       Drawn at 100 of 128, which is larger than it looks right at 128px. The
       size that matters is 16, where the tile eats most of the pixels: at 72
       the archive had 9px of glyph and its lid merged into its body, and the
       whole thing read as a smudge. Judge any change to this number by
       rendering it and looking at icon16.png, not at icon128.png. -->
  <rect width="128" height="128" rx="20" fill="#6F9889"/>
