<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --fg: #1f2328; --muted: #656d76;
    --border: #d0d7de; --accent: #0969da; --green: #1f883d; --danger: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24; --bg2: #22262c; --fg: #e6edf3; --muted: #8b949e;
      --border: #383e46; --accent: #539bf5; --green: #3fb950; --danger: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px;
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .container { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
  .field { margin-bottom: 22px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 8px 12px; font: inherit;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .actions { display: flex; gap: 10px; }
  button {
    padding: 8px 16px; font: inherit; font-weight: 500;
    border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg2); color: var(--fg);
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .status {
    margin-top: 18px; padding: 10px 14px; border-radius: 6px;
    font-size: 13px; display: none; white-space: pre-line;
  }
  .status.success { display: block; background: rgba(31,136,61,.12); color: var(--green); }
  .status.error { display: block; background: rgba(207,34,46,.12); color: var(--danger); }
</style>
</head>
<body>
  <div class="container">
    <h1>nodia</h1>
    <p class="subtitle">把当前页面存进 Obsidian 收藏库。保存由 nodia 应用落盘，扩展不做后台抓取。</p>

    <div class="field">
      <label for="apiBase">nodia 地址</label>
      <input type="text" id="apiBase" placeholder="http://127.0.0.1:8787">
      <p class="hint">nodia 应用监听的本地地址，默认 http://127.0.0.1:8787</p>
    </div>

    <div class="field">
      <label for="token">配对令牌</label>
      <input type="password" id="token" placeholder="从 nodia 设置 → 收藏库 复制">
      <p class="hint">在 nodia 的「设置 → 收藏库」里点复制，粘贴到这里。没有它 nodia 会拒绝请求——这样本机其他网页就无法读写你的收藏库。</p>
    </div>

    <div class="actions">
      <button id="save" class="primary">保存</button>
      <button id="test">测试连接</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
